# Use after the pinned release override. Public DNS must point to this host.
services:
  api:
    environment:
      GAME_PUBLIC_HOST: ${GAME_PUBLIC_HOST:?Set a reachable game hostname or IP}
  game:
    environment:
      GAME_PUBLIC_HOST: ${GAME_PUBLIC_HOST:?Set a reachable game hostname or IP}
  game2:
    environment:
      GAME_PUBLIC_HOST: ${GAME_PUBLIC_HOST:?Set a reachable game hostname or IP}
  edge:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Set the HTTPS API hostname}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - edge_data:/data
      - edge_config:/config
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
volumes:
  edge_data:
  edge_config:
